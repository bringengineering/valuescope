<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#1B4FD8" />
<title>BRING — 영업 지도</title>
<style>
  :root{
    --sans:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
    --bg:#EEF1F7;--surface:#FFFFFF;--surface-2:#F4F6FB;--ink:#131A26;--ink-2:#46536B;--muted:#7A879C;
    --line:#E4E9F1;--line-strong:#CBD3E1;--accent:#1B4FD8;
    --s0:#9AA7BC;--s1:#2E5BE6;--s2:#E8952E;--s3:#137A3C;--s4:#C4362F;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#0B0F17;--surface:#131A27;--surface-2:#1A2231;--ink:#EAF0F8;--ink-2:#A9B6CC;--muted:#6E7C93;
    --line:#26313F;--line-strong:#33404F;--accent:#5385F0;
  }}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;} html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;}
  .app{display:flex;flex-direction:column;height:100dvh;}
  header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 13px;background:var(--surface);border-bottom:1px solid var(--line);z-index:5;}
  .brand{font-weight:800;font-size:14.5px;white-space:nowrap;}.brand b{color:var(--accent);}
  .hbtns{display:flex;gap:6px;align-items:center;}
  .tbtn{font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;border-radius:8px;padding:6px 10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);}
  .tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  a.tbtn{text-decoration:none;}
  .mapwrap{position:relative;flex:1;min-height:0;}
  #map{width:100%;height:100%;background:var(--surface-2);}
  .slbl{transform:translate(-50%,-50%);font-family:var(--mono);font-size:11px;font-weight:800;color:#fff;padding:2px 8px;border-radius:999px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.35);pointer-events:none;}
  .pin{transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);cursor:pointer;}
  .ring{transform:translate(-50%,-50%);width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.85);border:2.5px solid #6E7C93;box-shadow:0 1px 3px rgba(0,0,0,.3);cursor:pointer;}
  .banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:8;background:#131A26;color:#fff;font-size:12.5px;font-weight:600;padding:10px 16px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.3);display:none;}
  .banner.on{display:block;}
  .fab{position:absolute;right:15px;bottom:calc(var(--sheet-peek) + 16px);z-index:7;width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:27px;font-weight:300;box-shadow:0 6px 18px rgba(27,79,216,.45);cursor:pointer;transition:bottom .25s;}
  .legend{position:absolute;left:12px;top:12px;z-index:6;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 9px;box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:10px;color:var(--ink-2);}
  .legend .lg{display:flex;align-items:center;gap:5px;}.legend .sw{width:9px;height:9px;border-radius:50%;}
  .maperr{position:absolute;inset:auto 12px calc(var(--sheet-peek) + 16px) 12px;z-index:9;background:#F7E4E2;color:#C4362F;border:1px solid #e6b3ad;border-radius:10px;padding:10px 12px;font-size:12px;display:none;text-align:center;}
  .maperr.on{display:block;}
  /* 바텀시트 */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.12);transition:transform .25s;max-height:78dvh;display:flex;flex-direction:column;}
  .sheet .grip{padding:8px 0 4px;display:flex;justify-content:center;cursor:pointer;flex:none;}
  .sheet .grip i{width:38px;height:5px;border-radius:3px;background:var(--line-strong);}
  .sheet .peek{padding:0 15px 11px;flex:none;}
  .stats{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--ink-2);align-items:center;}
  .stats b{color:var(--ink);font-size:15px;}
  .stats .sp{margin-left:auto;font-size:11px;color:var(--muted);}
  .body{overflow:auto;padding:4px 15px 22px;flex:1;}
  .filters{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 12px;}
  .chip{font:inherit;font-size:11px;cursor:pointer;padding:5px 10px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-2);}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
  input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:10px 11px;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  .addrow{display:flex;gap:7px;margin-bottom:8px;}.addrow input.nm{flex:1;min-width:0;}.addrow select{width:96px;}
  .btn{font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;border-radius:10px;padding:11px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;white-space:nowrap;}
  .btn.ghost{background:transparent;color:var(--accent);}
  .btn.wide{width:100%;}
  .place-on{background:#E8952E !important;border-color:#E8952E !important;}
  .hint{font-size:11px;color:var(--muted);line-height:1.5;margin:3px 0 14px;}
  .list{display:flex;flex-direction:column;gap:7px;}
  .ag{text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 12px;display:flex;align-items:center;gap:10px;}
  .ag .dot{width:12px;height:12px;border-radius:50%;flex:none;}
  .ag .nm{font-size:13.5px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ag .dg{font-family:var(--mono);font-size:10.5px;color:var(--muted);}
  .ag .rt{font-size:11px;color:#E8A93A;}
  .h4{font-size:12px;font-weight:800;margin:16px 0 8px;color:var(--ink);}
  .dongs{display:flex;flex-direction:column;gap:6px;}
  .drow{display:grid;grid-template-columns:18px 1fr auto;gap:9px;align-items:center;font-size:12px;}
  .drow .rk{font-family:var(--mono);color:var(--muted);text-align:center;font-size:11px;}
  .drow .bar{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;}.drow .bar i{display:block;height:100%;}
  .drow .c{font-family:var(--mono);font-size:11px;color:var(--ink-2);white-space:nowrap;}
  /* InfoWindow */
  .iw{font-family:var(--sans);width:236px;padding:14px 15px;color:#131A26;}
  .iw h2{margin:0 0 3px;font-size:15px;}.iw .dg{font-family:var(--mono);font-size:11px;color:#7A879C;margin-bottom:10px;}
  .iw select{width:100%;font-size:13px;margin-bottom:9px;font-weight:700;padding:8px;}
  .iw .stars{font-size:21px;color:#D6DEEB;cursor:pointer;margin-bottom:9px;letter-spacing:2px;}.iw .stars .on{color:#E8A93A;}
  .iw textarea{width:100%;min-height:54px;font-size:12.5px;line-height:1.5;resize:vertical;color:#131A26;}
  .iw .del{margin-top:9px;background:none;border:0;color:#C4362F;font-size:12.5px;cursor:pointer;padding:0;}
</style>
</head>
<body>
<div class="app" style="--sheet-peek:104px">
  <header>
    <div class="brand">BRING <b>영업지도</b></div>
    <div class="hbtns">
      <button class="tbtn on" id="secBtn">섹터</button>
      <a class="tbtn" href="./wonju.html">지도</a>
      <span class="tbtn" id="savePill" style="cursor:default">저장</span>
    </div>
  </header>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="legend" id="legend"></div>
    <div class="banner" id="banner">📍 중개사 위치를 지도에서 탭하세요 (다시 누르면 취소)</div>
    <div class="maperr" id="maperr"></div>
    <button class="fab" id="fab" title="중개사 핀 찍기">📍</button>
    <div class="sheet" id="sheet">
      <div class="grip" id="grip"><i></i></div>
      <div class="peek">
        <div class="stats" id="stats"></div>
        <div class="filters" id="filters" style="margin-top:10px"></div>
      </div>
      <div class="body" id="sheetBody">
        <div class="addrow"><input class="nm" id="in_name" placeholder="중개사무소 이름"><select id="in_dong"></select></div>
        <button class="btn wide" id="placeBtn" style="margin-bottom:8px">📍 지도에 위치 찍기</button>
        <div class="addrow"><input class="nm" id="in_addr" placeholder="주소로 찾기 (도로명/지번)"><button class="btn ghost" id="geoBtn">찾기</button></div>
        <div class="hint">네이버 지도 내 목록을 보며 같은 위치를 여기에 찍으세요. 방문하면 핀 색이 바뀝니다.</div>
        <input class="nm" id="search" placeholder="이름·동 검색" style="width:100%;margin-bottom:10px">
        <div class="list" id="list"></div>
        <div class="h4">다가구 밀집 = 타깃 순위 (원주 24,933건)</div>
        <div class="dongs" id="dongs"></div>
      </div>
    </div>
  </div>
</div>

    BASE.forEach(b=>{
      if(trackedIds.has(b.id))return;  // 이미 내 목록 → 색 핀으로 표시됨
      const m=new naver.maps.Marker({position:new naver.maps.LatLng(b.lat,b.lng),map,zIndex:40,
        icon:{content:'<div class="ring" title="'+esc(b.name)+'"></div>',anchor:new naver.maps.Point(7,7)}});
      naver.maps.Event.addListener(m,"click",()=>{
        // 탭 → 내 목록에 등록(미방문) 후 바로 편집
        const a={id:b.id,name:b.name,dong:b.dong||"",lat:b.lat,lng:b.lng,status:"미방문",rating:0,note:b.addr||""};
        data.agents.unshift(a);save();render();setTimeout(()=>focus(a.id),60);
      });
      baseMarkers.push(m);
    });
  }
  function renderMarkers(){
    for(const k in markers){markers[k].setMap(null);delete markers[k];}
    data.agents.forEach(a=>{
      if(a.lat==null)return;
      const m=new naver.maps.Marker({position:new naver.maps.LatLng(a.lat,a.lng),map,zIndex:100,
        icon:{content:`<div class="pin" style="background:${SHEX[a.status]}"></div>`,anchor:new naver.maps.Point(8,8)}});
      naver.maps.Event.addListener(m,"click",()=>openEdit(a.id,m));
      markers[a.id]=m;
    });
    if(window.naver&&map)renderBase();
  }
  function sectorInfo(s){
    return `<div class="iw"><h2>다가구 밀집 · ${esc(s.dong)}</h2><div class="dg">이 블록 기준</div>
      <div style="font-size:13px;line-height:2">다가구 <b>${s.n}동</b><br>중앙 실현수익률 <b>${s.nyld==null?"—":s.nyld+"%"}</b><br>중앙 세대수 <b>${s.units==null?"—":s.units+"세대"}</b></div>
      <div style="font-size:11px;color:#7A879C;margin-top:8px">이 근처 중개사가 이 다가구들을 다룹니다.</div></div>`;
  }
  function drawSectors(){
    sectorOverlays.forEach(o=>o.setMap(null));sectorOverlays=[];
    if(!showSec)return;
    SEC.strips.forEach(s=>{
      const[a1,n1,a2,n2]=s.rect;
      const path=[new naver.maps.LatLng(a1,n1),new naver.maps.LatLng(a1,n2),new naver.maps.LatLng(a2,n2),new naver.maps.LatLng(a2,n1)];
      const poly=new naver.maps.Polygon({map,paths:[path],strokeColor:s.color,strokeWeight:1,strokeOpacity:.55,fillColor:s.color,fillOpacity:.28,clickable:true});
      naver.maps.Event.addListener(poly,"click",e=>{if(placing)return;const pos=(e&&e.coord)||new naver.maps.LatLng((a1+a2)/2,(n1+n2)/2);iw.setContent(sectorInfo(s));iw.open(map,pos);});
      sectorOverlays.push(poly);
    });
    SEC.labels.forEach(l=>{
      const lbl=new naver.maps.Marker({position:new naver.maps.LatLng(l.center[0],l.center[1]),map,clickable:false,zIndex:55,
        icon:{content:`<div class="slbl" style="background:#131A26">${l.dong} ${l.n}</div>`,anchor:new naver.maps.Point(0,0)}});
      sectorOverlays.push(lbl);
    });
  }
  function focus(id){const a=find(id);if(!a||a.lat==null||!map)return;expand(false);map.panTo(new naver.maps.LatLng(a.lat,a.lng));if(markers[id])openEdit(id,markers[id]);}

  function openEdit(id,m){
    const a=find(id);if(!a)return;
    iw.setContent(`<div class="iw"><input value="${esc(a.name)}" oninput="vsName('${id}',this.value)" placeholder="중개사무소 이름" style="width:100%;font-weight:800;font-size:14px;margin-bottom:9px;padding:8px 9px"><div class="dg">${esc(a.dong||"위치 지정됨")}</div>
      <select onchange="vsStatus('${id}',this.value)">${STATES.map(s=>`<option ${s===a.status?"selected":""}>${s}</option>`).join("")}</select>
      <div class="stars">${[1,2,3,4,5].map(s=>`<span class="${s<=a.rating?"on":""}" onclick="vsStar('${id}',${s})">★</span>`).join("")}</div>
      <textarea placeholder="메모: 다가구 취급? 반응?" oninput="vsNote('${id}',this.value)">${esc(a.note||"")}</textarea>
      <button class="del" onclick="vsDel('${id}')">삭제</button></div>`);
    iw.open(map,m);
  }
  window.vsName=(id,v)=>{find(id).name=v;save();renderList();};
  window.vsStatus=(id,v)=>{find(id).status=v;save();render();};
  window.vsStar=(id,s)=>{const a=find(id);a.rating=(a.rating===s?0:s);save();render();openEdit(id,markers[id]);};
  window.vsNote=(id,v)=>{find(id).note=v;save();};
  window.vsDel=(id)=>{data.agents=data.agents.filter(x=>x.id!==id);if(markers[id]){markers[id].setMap(null);delete markers[id];}iw.close();save();render();};

  function addAt(lat,lng){
    const name=$("in_name").value.trim()||"중개사";
    const a={id:uid(),name,dong:$("in_dong").value||"",lat,lng,status:"미방문",rating:0,note:""};
    data.agents.unshift(a);$("in_name").value="";save();render();setTimeout(()=>focus(a.id),80);
  }
  function setPlacing(on){placing=on;$("banner").classList.toggle("on",on);$("placeBtn").classList.toggle("place-on",on);if(on)expand(false);}
  function expand(on){expanded=on;$("sheet").style.transform=on?"translateY(0)":`translateY(calc(100% - var(--sheet-peek)))`;}

  function initMap(){
    map=new naver.maps.Map("map",{center:new naver.maps.LatLng(37.345,127.925),zoom:13,minZoom:11,mapDataControl:false,logoControl:true,scaleControl:false});
    iw=new naver.maps.InfoWindow({borderWidth:1,borderColor:"#E4E9F1",backgroundColor:"#fff",anchorSize:new naver.maps.Size(0,0),pixelOffset:new naver.maps.Point(0,-6)});
    naver.maps.Event.addListener(map,"click",e=>{if(placing){addAt(e.coord.lat(),e.coord.lng());setPlacing(false);}else iw.close();});
    drawSectors();renderMarkers();
  }
  function geocodeAdd(){
    const q=$("in_addr").value.trim();if(!q)return;
    if(!(window.naver&&naver.maps.Service)){showErr("지오코딩 준비 안됨");return;}
    naver.maps.Service.geocode({query:q},(st,res)=>{
      if(st!==naver.maps.Service.Status.OK||!res.v2.addresses.length){showErr("주소를 찾지 못했습니다");return;}
      const ad=res.v2.addresses[0];addAt(+ad.y,+ad.x);$("in_addr").value="";map.setZoom(16);
    });
  }
  function showErr(m){$("maperr").textContent=m;$("maperr").classList.add("on");setTimeout(()=>$("maperr").classList.remove("on"),2800);}
  function loadNaver(){
    window.navermap_authFailure=()=>showErr("네이버 지도 인증 실패 (도메인 등록 확인)");
    window.__ready=()=>initMap();
    const s=document.createElement("script");
    s.src=`https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${NAVER_KEY}&submodules=geocoder&callback=__ready`;
    s.async=true;s.onerror=()=>showErr("네이버 지도 로드 차단");document.head.appendChild(s);
  }

  // UI init
  $("in_dong").innerHTML='<option value="">동</option>'+DRANK.map(d=>`<option>${d}</option>`).join("");
  $("legend").innerHTML=STATES.map(s=>`<span class="lg"><span class="sw" style="background:${SHEX[s]}"></span>${s}</span>`).join("");
  const dongAgg={};SECTORS.forEach(s=>{dongAgg[s.dong]=(dongAgg[s.dong]||0)+s.n;});
  const dongTop=Object.entries(dongAgg).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const mx=dongTop.length?dongTop[0][1]:1;
  $("dongs").innerHTML=dongTop.map(([dg,n],i)=>`<div class="drow"><span class="rk">${i+1}</span><div class="bar"><i style="width:${Math.max(5,n/mx*100)}%;background:${i<3?'#137A3C':'#2E5BE6'}"></i></div><span class="c">${dg} ${n}</span></div>`).join("");
  $("secBtn").addEventListener("click",()=>{showSec=!showSec;$("secBtn").classList.toggle("on",showSec);drawSectors();});
  $("placeBtn").addEventListener("click",()=>setPlacing(!placing));
  $("geoBtn").addEventListener("click",geocodeAdd);
  $("in_addr").addEventListener("keydown",e=>{if(e.key==="Enter")geocodeAdd();});
  $("search").addEventListener("input",renderList);
  $("grip").addEventListener("click",()=>expand(!expanded));
  $("fab").addEventListener("click",()=>setPlacing(!placing));  // 바로 핀 찍기 모드
  document.addEventListener("keydown",e=>{if(e.key==="Escape")setPlacing(false);});
  load();sidebar();expand(false);loadNaver();
</script>
</body>
</html>
